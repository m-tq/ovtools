# ===================================================================
# Octra Live Monitor - Nginx site
# -------------------------------------------------------------------
# Domain  : onode-quwr9.xme.my.id   (edit server_name to your domain)
# SSL     : Cloudflare Origin Certificate (wildcard *.example.com)
# Static  : /opt/octra/dashboard
# Backend : python dashboard on 127.0.0.1:9090  (proxy_pass /api/)
#
# Public access is Cloudflare-only:
#   - /etc/nginx/snippets/octra-cloudflare.conf allows only CF edge IPs,
#   - the node RPC is kept on localhost by octra-rpc-firewall.service.
# ===================================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name onode-quwr9.xme.my.id;
    server_tokens off;

    ssl_certificate     /etc/ssl/octra/fullchain.pem;
    ssl_certificate_key /etc/ssl/octra/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    include /etc/nginx/snippets/octra-cloudflare.conf;
    if ($cloudflare_edge = 0) { return 403; }
    include /etc/nginx/snippets/octra-security-headers.conf;

    root  /opt/octra/dashboard;
    index index.html;

    # -- Dashboard shell --------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/octra-security-headers.conf;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # -- Framework + app assets (cacheable, but revalidated on release) --
    location ~* \.(css|js|ttf|woff2?|svg|ico|png)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/octra-security-headers.conf;
        try_files $uri =404;
    }

    # -- Telemetry API -> Python backend -----------------------------
    location /api/ {
        limit_req zone=octra_api burst=20 nodelay;
        limit_conn octra_conn 10;
        limit_req_status 429;
        proxy_pass         http://127.0.0.1:9090/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    25s;
        proxy_send_timeout    10s;
        proxy_buffering       off;   # live JSON should never be buffered
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/octra-security-headers.conf;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_min_length 256;
}

# -- HTTP -> HTTPS (Cloudflare edge only) ----------------------------
server {
    listen 80;
    listen [::]:80;
    server_name onode-quwr9.xme.my.id;
    server_tokens off;
    include /etc/nginx/snippets/octra-cloudflare.conf;
    if ($cloudflare_edge = 0) { return 403; }
    return 301 https://$host$request_uri;
}
