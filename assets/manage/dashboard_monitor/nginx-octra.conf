# ===================================================================
# Octra Live Monitor - Nginx site
# -------------------------------------------------------------------
# Domain  : node.example.com   (the deploy script rewrites server_name from -Domain)
# SSL     : Cloudflare Origin Certificate (wildcard *.example.com)
# Static  : /opt/octra/dashboard
# Backend : python dashboard on 127.0.0.1:9090  (proxy_pass /api/)
# ===================================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name node.example.com;

    ssl_certificate     /etc/ssl/octra/fullchain.pem;
    ssl_certificate_key /etc/ssl/octra/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "no-referrer" always;

    root  /opt/octra/dashboard;
    index index.html;

    # -- Dashboard shell --------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # -- Framework + app assets (cacheable, but revalidated on release) --
    location ~* \.(css|js|ttf|woff2?|svg|ico|png)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # -- Telemetry API -> Python backend -----------------------------
    location /api/ {
        proxy_pass         http://127.0.0.1:9090/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    25s;
        proxy_send_timeout    10s;
        proxy_buffering       off;   # live JSON should never be buffered
        add_header Cache-Control "no-store" always;
    }


    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_min_length 256;
}

# -- HTTP -> HTTPS ---------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name node.example.com;
    return 301 https://$host$request_uri;
}
